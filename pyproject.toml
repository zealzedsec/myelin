[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myelin"
version = "0.1.0"
description = "A self-reinforcing knowledge brain over a markdown vault: hybrid recall, spreading activation, a graph autoencoder, and a self-quiz that gates its own evolution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
agent = ["anthropic>=0.69"]
app = ["pywebview>=5"]
dev = ["pytest>=8"]

[project.scripts]
myelin = "myelin.cli:main"

[tool.setuptools.packages.find]
include = ["myelin*"]

[tool.setuptools.package-data]
myelin = ["ui/*", "ui/js/*", "ui/fonts/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
